
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل دخول | في يوني باص</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', Tahoma, sans-serif; }
body { background:#f4f7ff; color:#1a2a4a; }
header { background:#0a2a7a; color:#fff; padding:15px 20px; display:flex; justify-content:space-between; align-items:center; }
.logo { font-size:22px; font-weight:900; }
.logo span { color:#ffcc00; font-size:14px; display:block; }
.logo a { color:#fff; text-decoration:none; }
.back { color:#fff; text-decoration:none; font-weight:700; }
.box { background:#fff; max-width:450px; margin:40px auto; padding:30px; border-radius:18px; box-shadow:0 10px 30px rgba(0,0,0,0.1); text-align:center; }
.box .emoji { font-size:55px; }
.box h2 { color:#0a2a7a; margin:10px 0 5px; }
.box p { color:#777; margin-bottom:20px; }
label { display:block; text-align:right; margin:12px 0 5px; font-weight:700; }
input { width:100%; padding:12px; border:2px solid #e0e7ff; border-radius:10px; font-size:16px; outline:none; text-align:right; }
input:focus { border-color:#1a6cff; }
button { width:100%; background:#0a2a7a; color:#fff; border:none; padding:14px; border-radius:10px; font-size:18px; font-weight:900; margin-top:20px; cursor:pointer; }
button:hover { background:#1a6cff; }
.link { margin-top:15px; }
.link a { color:#1a6cff; font-weight:800; text-decoration:none; }
.forgot { display:block; margin-top:12px; color:#888; font-size:14px; text-decoration:none; }
.admin-box { background:#f0f4ff; border-radius:10px; padding:12px; margin-top:20px; font-size:14px; }
.admin-box a { color:#0a2a7a; font-weight:800; }
</style>
</head>
<body>

<header>
  <div class="logo"><a href="index.html">🚌 في يوني باص <span>Fy-Uni-Bus</span></a></div>
  <a class="back" href="index.html">🏠 الرئيسية</a>
</header>

<div class="box">
  <div class="emoji">👋</div>
  <h2>أهلاً بيك تاني</h2>
  <p>سجل دخول واحجز باصك</p>

  <form action="/login" method="POST">
    <label>رقم التليفون</label>
    <input type="tel" name="phone" placeholder="01xxxxxxxxx" required>

    <label>كلمة السر</label>
    <input type="password" name="password" placeholder="كلمة السر" required>

    <button type="submit">دخول 🚌</button>
  </form>

  <a class="forgot" href="#">نسيت كلمة السر؟</a>
  <div class="link">معندكش حساب؟ <a href="register.html">اعمل حساب جديد</a></div>

  <div class="admin-box">
    انت أدمن؟ <a href="admin.html">دخول لوحة التحكم</a>
  </div>
</div>

</body>
</html>
